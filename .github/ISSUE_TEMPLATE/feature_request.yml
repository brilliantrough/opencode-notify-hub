name: Feature request
description: Propose a user-visible improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - OpenCode plugin
        - Gateway
        - Desktop client
        - Android client
        - Contracts/API
        - Deployment/documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user/operator problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Compatibility, privacy, and operational impact
      description: Note protocol, stored-data, notification, platform, or migration implications.
