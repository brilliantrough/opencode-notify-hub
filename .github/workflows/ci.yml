name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify generated OpenAPI document
        run: >-
          pnpm --filter @notify/contracts generate:openapi &&
          git diff --exit-code -- packages/contracts/openapi/openapi.yaml

  gateway-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @notify/gateway test:integration

  flutter:
    runs-on: ubuntu-latest
    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux client dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libnotify-dev
          libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install pinned OpenAPI generator wrapper
        run: dart pub global activate openapi_generator_cli 7.0.0
      - name: Verify generated Dart API
        run: >-
          PATH="$HOME/.pub-cache/bin:$PATH"
          bash packages/notify_api/tool/regen.sh &&
          git diff --exit-code -- packages/notify_api pubspec.lock
      - run: flutter analyze
      - run: flutter test
        working-directory: apps/client
      - run: dart test
        working-directory: packages/notify_api

  flutter-windows:
    runs-on: windows-latest
    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        working-directory: apps/client
      - run: dart test
        working-directory: packages/notify_api
      - name: Build Windows release bundle
        run: flutter build windows --release
        working-directory: apps/client
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: apps/client/build/windows/x64/runner/Release
          if-no-files-found: error

  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run gateway image smoke test
        run: timeout 15m bash apps/gateway/tests/deploy/image-smoke.sh
