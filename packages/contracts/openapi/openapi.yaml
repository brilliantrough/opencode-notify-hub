            - stale
            - upstream_error
            - result_unknown
          type: string
      required:
        - commandId
        - status
      type: object
    RefreshBody:
      additionalProperties: false
      properties:
        refreshToken:
          minLength: 1
          type: string
      required:
        - refreshToken
      type: object
    RegisterBody:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
      required:
        - email
        - password
      type: object
    RegisterDeviceBody:
      additionalProperties: false
      properties:
        enabled:
          default: true
          type: boolean
        fcmToken:
          maxLength: 4096
          minLength: 1
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
        platform:
          enum:
            - windows
            - linux
            - android
        soundEnabled:
          default: true
          type: boolean
      required:
        - name
        - platform
      type: object
    ResetPasswordBody:
      additionalProperties: false
      properties:
        code:
          description: Eight-character high-entropy alphanumeric code delivered over SMTP.
          maxLength: 8
          minLength: 8
          pattern: ^[A-Za-z0-9]{8}$
          type: string
        email:
          format: email
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
      required:
        - email
        - code
        - password
      type: object
    TokenPair:
      additionalProperties: false
      properties:
        accessToken:
          description: JWT access token, valid for 15 minutes.
          minLength: 1
          type: string
        refreshToken:
          description: Opaque refresh token, valid for 30 days; rotated on every refresh.
          minLength: 1
          type: string
      required:
        - accessToken
        - refreshToken
      type: object
    VerifyEmailBody:
      additionalProperties: false
      properties:
        code:
          description: Eight-character high-entropy alphanumeric code delivered over SMTP.
          maxLength: 8
          minLength: 8
          pattern: ^[A-Za-z0-9]{8}$
          type: string
        email:
          format: email
          type: string
      required:
        - email
        - code
      type: object
    WsServerMessage:
      oneOf:
        - additionalProperties: false
          properties:
            event:
              oneOf:
                - additionalProperties: false
                  properties:
                    eventId:
                      format: uuid
                      type: string
                    occurredAt:
                      format: date-time
                      type: string
                    payload:
                      additionalProperties: false
                      properties:
                        elapsedSeconds:
                          minimum: 0
                          type: integer
                        status:
                          enum:
                            - busy
                            - retry
                      required:
                        - status
                        - elapsedSeconds
                      type: object
                    session:
                      additionalProperties: false
                      properties:
                        id:
                          minLength: 1
                          type: string
                        title:
                          type: string
                      required:
                        - id
                        - title
                      type: object
                    source:
                      additionalProperties: false
                      properties:
                        directory:
                          minLength: 1
                          type: string
                        machine:
                          minLength: 1
                          type: string
                        project:
                          minLength: 1
                          type: string
                      required:
                        - machine
                        - project
                        - directory
                      type: object
                    type:
                      const: heartbeat
                  required:
                    - eventId
                    - type
                    - occurredAt
                    - source
                    - session
                    - payload
                  type: object
                - additionalProperties: false
                  properties:
                    eventId:
                      format: uuid
                      type: string
                    occurredAt:
                      format: date-time
                      type: string
                    payload:
                      oneOf:
                        - additionalProperties: false
                          properties:
                            kind:
                              const: question
                            questions:
                              items:
                                additionalProperties: false
                                properties:
                                  multiple:
                                    type: boolean
                                  options:
                                    items:
                                      additionalProperties: false
                                      properties:
                                        description:
                                          type: string
                                        label:
                                          minLength: 1
                                          type: string
                                      required:
                                        - label
                                      type: object
                                    maxItems: 16
                                    type: array
                                  question:
                                    maxLength: 2000
                                    minLength: 1
                                    type: string
                                required:
                                  - question
                                type: object
                              maxItems: 8
                              minItems: 1
                              type: array
                            requestId:
                              minLength: 1
                              type: string
                          required:
                            - requestId
                            - kind
                            - questions
                          type: object
                        - additionalProperties: false
                          properties:
                            kind:
                              const: permission
                            permission:
                              additionalProperties: false
                              properties:
                                permission:
                                  minLength: 1
                                  type: string
                                summary:
                                  maxLength: 500
                                  minLength: 1
                                  type: string
                              required:
                                - permission
                                - summary
                              type: object
                            requestId:
                              minLength: 1
                              type: string
                          required:
                            - requestId
                            - kind
                            - permission
                          type: object
                        - additionalProperties: false
                          properties:
                            kind:
                              const: provider_action
                            providerAction:
                              additionalProperties: false
                              properties:
                                label:
                                  maxLength: 120
                                  minLength: 1
                                  type: string
                                link:
                                  format: uri
                                  maxLength: 2048
                                  type: string
                                message:
                                  maxLength: 500
                                  minLength: 1
                                  type: string
                                provider:
                                  maxLength: 120
                                  minLength: 1
                                  type: string
                                title:
                                  maxLength: 120
                                  minLength: 1
                                  type: string
                              required:
                                - provider
                                - title
                                - message
                                - label
                              type: object
                            requestId:
                              minLength: 1
                              type: string
                          required:
                            - requestId
                            - kind
                            - providerAction
                          type: object
                    session:
                      additionalProperties: false
                      properties:
                        id:
                          minLength: 1
                          type: string
                        title:
                          type: string
                      required:
                        - id
                        - title
                      type: object
                    source:
                      additionalProperties: false
                      properties:
                        directory:
                          minLength: 1
                          type: string
                        machine:
                          minLength: 1
                          type: string
                        project:
                          minLength: 1
                          type: string
                      required:
                        - machine
                        - project
                        - directory
                      type: object
                    type:
                      const: action_required
                  required:
                    - eventId
                    - type
                    - occurredAt
                    - source
                    - session
                    - payload
                  type: object
                - additionalProperties: false
                  properties:
                    eventId:
                      format: uuid
                      type: string
                    occurredAt:
                      format: date-time
                      type: string
                    payload:
                      additionalProperties: false
                      properties:
                        kind:
                          enum:
                            - question
                            - permission
                        requestId:
                          minLength: 1
                          type: string
                      required:
                        - requestId
                        - kind
                      type: object
                    session:
                      additionalProperties: false
                      properties:
                        id:
                          minLength: 1
                          type: string
                        title:
                          type: string
                      required:
                        - id
                        - title
                      type: object
                    source:
                      additionalProperties: false
                      properties:
                        directory:
                          minLength: 1
                          type: string
                        machine:
                          minLength: 1
                          type: string
                        project:
                          minLength: 1
                          type: string
                      required:
                        - machine
                        - project
                        - directory
                      type: object
                    type:
                      const: action_resolved
                  required:
                    - eventId
                    - type
                    - occurredAt
                    - source
                    - session
                    - payload
                  type: object
                - additionalProperties: false
                  properties:
                    eventId:
                      format: uuid
                      type: string
                    occurredAt:
                      format: date-time
                      type: string
                    payload:
                      additionalProperties: false
                      properties:
                        elapsedSeconds:
                          minimum: 0
                          type: integer
                        outcome:
                          enum:
                            - completed
                            - failed
                            - stopped
                        summary:
                          maxLength: 500
                          type: string
                      required:
                        - outcome
                        - elapsedSeconds
                      type: object
                    session:
                      additionalProperties: false
                      properties:
                        id:
                          minLength: 1
                          type: string
                        title:
                          type: string
                      required:
                        - id
                        - title
                      type: object
                    source:
                      additionalProperties: false
                      properties:
                        directory:
                          minLength: 1
                          type: string
                        machine:
                          minLength: 1
                          type: string
                        project:
                          minLength: 1
                          type: string
                      required:
                        - machine
                        - project
                        - directory
                      type: object
                    type:
                      const: terminal
                  required:
                    - eventId
                    - type
                    - occurredAt
                    - source
                    - session
                    - payload
                  type: object
            type:
              const: event
          required:
            - type
            - event
          type: object
        - additionalProperties: false
          properties:
            instances:
              items:
                additionalProperties: false
                properties:
                  directory:
                    minLength: 1
                    type: string
                  instanceId:
                    format: uuid
                    type: string
                  lastSeenAt:
                    format: date-time
                    type: string
                  machine:
                    minLength: 1
                    type: string
                  openCodeVersion:
                    minLength: 1
                    type: string
                  project:
                    minLength: 1
                    type: string
                  protocolVersion:
                    minimum: 1
                    type: integer
                  state:
                    enum:
                      - controllable
                      - conflicting
                      - incompatible
                      - offline
                    type: string
                required:
                  - instanceId
                  - machine
                  - project
                  - directory
                  - openCodeVersion
                  - protocolVersion
                  - state
                  - lastSeenAt
                type: object
              type: array
            type:
              const: instance_presence
          required:
            - type
            - instances
          type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Short-lived (15 minute) JWT access token from login or refresh.
      scheme: bearer
      type: http
    ingestKeyAuth:
      description: Ingest credentials `keyId.secret`; every request must also carry valid X-Notify-Timestamp and X-Notify-Signature HMAC headers.
      scheme: bearer
      type: http
    pluginKeyAuth:
      description: Plugin credential `keyId.secret`; the control WebSocket does not use the event-ingest HMAC headers.
      scheme: bearer
      type: http
info:
  description: Single protocol source for the opencode-notify gateway, the OpenCode plugin, and the Flutter clients. Generated from the shared JSON schemas in @notify/contracts; do not edit by hand.
  license:
    identifier: MIT
    name: MIT
  title: opencode-notify gateway
  version: 0.1.0
openapi: 3.1.0
paths:
  /health/live:
    get:
      operationId: checkLiveness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: Process is alive.
      security: []
      summary: Liveness probe.
      tags:
        - health
  /health/ready:
    get:
      description: Ready only when the database is reachable and migrations are current.
      operationId: checkReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: Ready to serve.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Database unavailable or schema not migrated.
      security: []
      summary: Readiness probe.
      tags:
        - health
  /v1/auth/forgot-password:
    post:
      description: Returns the same response for known and unknown emails to avoid enumeration.
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailBody"
        required: true
      responses:
        "204":
          description: Reset email sent when the account exists.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
      security: []
      summary: Send a password reset email.
      tags:
        - auth
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: Session tokens.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid credentials.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Email address is not verified.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
      security: []
      summary: Log in with email and password.
      tags:
        - auth
  /v1/auth/logout:
    post:
      description: "Idempotent: unknown or already revoked tokens still return 204."
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshBody"
        required: true
      responses:
        "204":
          description: Refresh token revoked.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
      security: []
      summary: Revoke a refresh token.
      tags:
        - auth
  /v1/auth/refresh:
    post:
      description: Every refresh rotates the refresh token. Presenting an already rotated token revokes the whole token family (REFRESH_REUSED).
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: Rotated session tokens.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid, expired, or reused refresh token.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
      security: []
      summary: Rotate a refresh token for a new token pair.
      tags:
        - auth
  /v1/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
        required: true
      responses:
        "201":
          description: Account created; verification email sent.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Email already registered.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Verification email delivery failed; the unverified account can resend later.
      security: []
      summary: Register an account and send a verification email.
      tags:
        - auth
  /v1/auth/resend-verification:
    post:
      description: Returns the same response for known and unknown emails to avoid enumeration.
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailBody"
        required: true
      responses:
        "204":
          description: Verification email sent when the account exists.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Email delivery failed; retry later.
      security: []
      summary: Resend the verification email.
      tags:
        - auth
  /v1/auth/reset-password:
    post:
      description: A successful reset revokes every refresh-token family of the user.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
        required: true
      responses:
        "204":
          description: Password reset.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid, expired, or already used code.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
      security: []
      summary: Reset the password with the SMTP-delivered code.
      tags:
        - auth
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailBody"
        required: true
      responses:
        "204":
          description: Email verified.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid, expired, or already used code.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
      security: []
      summary: Verify an email address with the SMTP-delivered code.
      tags:
        - auth
  /v1/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
          description: Registered devices.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
      security:
        - bearerAuth: []
      summary: List the authenticated user's devices.
      tags:
        - devices
    post:
      description: The server applies enabled/soundEnabled defaults when the body omits them.
      operationId: registerDevice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
          description: Registered device.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
      security:
        - bearerAuth: []
      summary: Register a device.
      tags:
        - devices
  /v1/devices/{id}:
    delete:
      operationId: deleteDevice
      parameters:
        - description: Device identifier.
          in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "204":
          description: Device deleted.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unknown device for this user.
      security:
        - bearerAuth: []
      summary: Delete a device.
      tags:
        - devices
    patch:
      operationId: updateDevice
      parameters:
        - description: Device identifier.
          in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchDeviceBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
          description: Updated device.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unknown device for this user.
      security:
        - bearerAuth: []
      summary: Update a device.
      tags:
        - devices
  /v1/events:
    post:
      description: "Authenticate with `Authorization: Bearer keyId.secret` plus the X-Notify-Timestamp and X-Notify-Signature HMAC headers. Events are deduplicated per user by eventId for a short window."
      operationId: ingestEvent
      parameters:
        - description: Unix milliseconds. Requests more than 5 minutes from server time are rejected.
          in: header
          name: X-Notify-Timestamp
          required: true
          schema:
            type: integer
        - description: Hex HMAC-SHA256 of `${timestamp}.${rawBody}` keyed with the ingest-key secret.
          in: header
          name: X-Notify-Signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyEvent"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventIngestResponse"
          description: Ingest outcome.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unknown, revoked, or badly signed ingest credentials.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
      security:
        - ingestKeyAuth: []
      summary: Ingest a signed notification event from the OpenCode plugin.
      tags:
        - events
  /v1/ingest-keys:
    get:
      description: List items never include the key secret.
      operationId: listIngestKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestKeyListResponse"
          description: Ingest keys without secrets.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
      security:
        - bearerAuth: []
      summary: List ingest keys.
      tags:
        - ingest-keys
    post:
      description: The secret is returned exactly once in this response and is never recoverable afterwards; the server stores only SHA-256(secret).
      operationId: createIngestKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngestKeyBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIngestKeyResponse"
          description: Created ingest key including the one-time secret.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
      security:
        - bearerAuth: []
      summary: Create an ingest key.
      tags:
        - ingest-keys
  /v1/ingest-keys/{id}:
    delete:
      operationId: revokeIngestKey
      parameters:
        - description: Ingest-key identifier.
          in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "204":
          description: Ingest key revoked.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unknown ingest key for this user.
      security:
        - bearerAuth: []
      summary: Revoke an ingest key.
      tags:
        - ingest-keys
  /v1/pending-interactions:
    get:
      description: Asks every owned online compatible Plugin instance for its current OpenCode questions and permissions and returns a unified snapshot. OpenCode is authoritative; the snapshot is a projection. Conflicting, incompatible, and offline instances are not queried, and provider actions never appear here.
      operationId: getPendingInteractions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingSnapshot"
          description: Pending interactions snapshot.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
      security:
        - bearerAuth: []
      summary: List the authenticated user's pending interactions.
      tags:
        - pending
  /v1/pending-interactions/commands/{commandId}:
    get:
      description: "Returns the in-memory outcome correlation for a command submitted by the authenticated account, keyed by the client-generated commandId. The outcome is body-free: it carries only correlation and status metadata, never the question answers or permission decision. A client timeout should query the same commandId to distinguish accepted, confirmed, stale, and result_unknown before resubmitting."
      operationId: getCommandOutcome
      parameters:
        - description: Client-generated command identifier.
          in: path
          name: commandId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandOutcome"
          description: Body-free command outcome.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unknown command outcome for this user.
      security:
        - bearerAuth: []
      summary: Query the body-free outcome of a client-generated command.
      tags:
        - pending
  /v1/pending-interactions/{instanceId}/permissions/{requestId}/decision:
    post:
      description: Validates and submits one immediate allow-once, always-allow, or reject decision for a pending permission owned by the authenticated account and routes the command to the exact Plugin instance. The response carries the client-generated commandId and the terminal outcome; it confirms gateway routing, not that OpenCode applied the decision. Leaving the request undecided has no OpenCode side effect.
      operationId: decidePermission
      parameters:
        - description: OpenCode instance identifier.
          in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
        - description: OpenCode permission request identifier.
          in: path
          name: requestId
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecidePermissionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCommandResult"
          description: Terminal command outcome.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unknown instance for this user, or no matching pending permission request.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Command conflicts with existing state; for example the request is stale or a conflicting command is already in flight.
      security:
        - bearerAuth: []
      summary: Submit an immediate decision for a pending OpenCode permission.
      tags:
        - pending
  /v1/pending-interactions/{instanceId}/questions/{requestId}/answer:
    post:
      description: Validates and submits one complete ordered answer set for a pending question owned by the authenticated account and routes the command to the exact Plugin instance. The response carries the client-generated commandId and the terminal outcome; it confirms gateway routing, not that OpenCode applied the answers. Leaving the request unanswered has no OpenCode side effect and never invokes question reject.
      operationId: answerQuestion
      parameters:
        - description: OpenCode instance identifier.
          in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
        - description: OpenCode question request identifier.
          in: path
          name: requestId
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuestionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCommandResult"
          description: Terminal command outcome.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unknown instance for this user, or no matching pending question request.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Command conflicts with existing state; for example the request is stale or a conflicting command is already in flight.
      security:
        - bearerAuth: []
      summary: Submit a complete answer set for a pending OpenCode question.
      tags:
        - pending
  /v1/plugin/ws:
    get:
      description: The HTTP Upgrade authenticates with the existing Plugin key. The Plugin sends one PluginControlClientMessage registration and receives a PluginControlServerMessage result. Notification ingestion remains available when control is conflicting or incompatible.
      operationId: connectPluginControl
      responses:
        "101":
          description: WebSocket upgrade accepted for Plugin control frames.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing, unknown, or revoked Plugin key.
      security:
        - pluginKeyAuth: []
      summary: Upgrade an OpenCode Plugin to its control WebSocket.
      tags:
        - realtime
  /v1/ws:
    get:
      description: The HTTP Upgrade request authenticates with the bearer access token. After the upgrade the server sends WsServerMessage frames; there is no client-to-server message protocol and incoming frames are ignored. The socket closes with code 4401 when the access token expires; reconnect with a fresh token. Events missed while disconnected are not replayed.
      operationId: connectEvents
      responses:
        "101":
          description: WebSocket upgrade accepted; frames carry WsServerMessage only.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid access token.
      security:
        - bearerAuth: []
      summary: Upgrade to the realtime WebSocket.
      tags:
        - realtime
